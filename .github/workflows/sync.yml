# Mirrors the plugin index from Codeberg Pages (the source of truth, updated by
# each plugin's release workflow) and republishes it on GitHub Pages.
name: Sync index

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch index from Codeberg
        run: |
          curl -fsSL --retry 3 https://codeberg.org/surging9143/pages/raw/branch/main/index.yml -o new-index.yml
          # sanity check so an error page can never overwrite the index
          head -1 new-index.yml | grep -q '^- id:' || { echo "unexpected index content" >&2; exit 1; }
          mv new-index.yml index.yml

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.yml
          git diff --staged --quiet && { echo "index unchanged"; exit 0; }
          git commit -m "Sync index from Codeberg"
          git push
          # pushes made with GITHUB_TOKEN don't trigger the Pages build, so request it
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
