# Builds index.yml from each plugin's latest GitHub release (plugins.yml lists them)
# and republishes it on GitHub Pages. Independent of the Codeberg Pages index,
# which the plugin release workflows keep updating separately.
name: Build index

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: ["main"]
    paths: ["plugins.yml", "build_index.py"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: pip install --quiet pyyaml

      - name: Rebuild index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 build_index.py

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.yml
          git diff --staged --quiet && { echo "index unchanged"; exit 0; }
          git commit -m "Update index"
          git push
          # pushes made with GITHUB_TOKEN don't trigger the Pages build, so request it
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
